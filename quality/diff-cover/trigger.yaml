tool: diff-cover
language: javascript
language_version: "22"
technique: "Regression / Coverage Delta"
classification: "Coverage Delta %"
target_files: [../../coverage/cobertura-coverage.xml]
run:
  command: "npx c8 --reporter=cobertura mocha 'test/**/*.test.js' && diff-cover coverage/cobertura-coverage.xml --compare-branch=main"
requirements:
  - diff-cover (Python)
expects:
  diff_coverage_report_generated: true
verified_in_session: true
