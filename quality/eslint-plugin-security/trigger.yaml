tool: eslint-plugin-security
language: javascript
language_version: "22"
technique: "Static Application Security Testing"
classification: "SAST Finding"
target_files: [../../src/, ../../.eslintrc.json]
run:
  command: "npx eslint src/ --ext .js,.jsx"
expects:
  plugin_rules_active: true
verified_in_session: true
verified_result: "loaded via plugin:security/recommended-legacy in the real .eslintrc.json; 0 findings across the current 5-file src/ tree, a genuine clean result"
