tool: eslint
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Static Lint Analysis"
target_files: [../../src/]
run:
  command: "npx eslint src/ --ext .js,.jsx"
expects:
  lint_report_generated: true
verified_in_session: true
verified_result: "ran clean (0 errors) across all 5 files in src/ under eslint:recommended + react/recommended + react/jsx-runtime + security + sonarjs recommended configs"
